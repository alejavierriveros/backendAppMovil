spring.application.name=backenBD
server.port=8080

# Conexión a tu base de datos "Bitacora" en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/Bitacora?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Creación y actualización automática de tablas JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

