# Nombre interno de la aplicacion Spring Boot
spring.application.name=backenBD

# Puerto HTTP donde escuchara el servidor (Android Studio se conecta a http://10.0.2.2:8080/)
server.port=8080

# Conexion a MySQL en XAMPP (crea la base de datos 'Bitacora' automaticamente si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/Bitacora?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crea y actualiza las tablas en MySQL automaticamente segun las clases @Entity de model/
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave secreta en Base64 para firmar tokens JWT y tiempo de duracion (86400000 ms = 24 horas)
jwt.secret=Yml0YWNvcmFFc2NvbGFyU2VjcmV0S2V5MjAyNlNwcmluZ0Jvb3RBbmRyb2lkQXBwTW92aWw=
jwt.expiration=86400000
